services:
  database:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_PASSWORD=mysecret'
      - 'POSTGRES_USER=myuser'
      - 'POSTGRES_DB=elternsprechtag'
    ports:
      - '5432:5432'
    restart: always
    volumes:
      - 'postgres_data:/var/lib/postgresql/data'

volumes:
  postgres_data:
