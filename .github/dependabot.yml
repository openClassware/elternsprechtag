# Monatliche Abhängigkeits-Aktualisierungen als Pull Request, damit Sicherheits-
# aktualisierungen nicht liegen bleiben.
#
# Der Weg über einen Pull Request ist der Punkt: jede Aktualisierung läuft durch das
# Test-Gate aus `.github/workflows/ci.yml` (Trigger `pull_request` gegen `main`), und der
# Maintainer entscheidet am Prüfergebnis, ob sie gefahrlos gemerged werden kann. Der Lauf
# braucht keine Secrets und nur `contents: read` — das reicht auch für das eingeschränkte
# Token eines Dependabot-Pull-Requests.
#
# Drei Ökosysteme, weil alle veralten können: die Maven-Abhängigkeiten der Anwendung, die
# im Repository verwendeten GitHub-Actions und die npm-Abhängigkeiten der Doku-Site in
# `site/`. Blieben die Actions außen vor, würde ausgerechnet die Pipeline, die alles andere
# prüft, selbst nicht aktuell gehalten.
version: 2
updates:
  # Anwendung: `pom.xml` im Repo-Root (Spring Boot, Vaadin, …).
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: monthly
    # Ein gebündelter Pull Request statt eines pro Abhängigkeit: ein Maven-Build dauert
    # hier Minuten, und Spring-Boot- wie Vaadin-Artefakte wandern ohnehin im Verbund.
    groups:
      maven:
        patterns:
          - "*"

  # Pipeline: alle Workflows unter `.github/workflows/`. Der Pfad ist bei diesem
  # Ökosystem immer `/`, nicht das Workflow-Verzeichnis.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"

  # Doku-Site: `site/package.json` (Astro Starlight). Die Versionen sind exakt gepinnt, weil
  # Starlight vor 1.0 steht; der gebündelte Pull Request ist das gesammelte Upgrade, und der
  # Job `doku` in `ci.yml` baut die Site dafür.
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: monthly
    groups:
      doku-site:
        patterns:
          - "*"
