# Prüf-Lauf für jeden Pull Request gegen `main` — auch aus einem Fork.
#
# Bewusst getrennt vom Deploy-Workflow: der hängt an `push: main` und darf hier nicht
# mitlaufen. Das Test-Gate ist trotzdem eine Spiegelung des Gates aus
# `deploy-demo.yml` — gleicher Service-Container, gleiche Verbindungswerte —, damit ein
# Fork-Lauf dieselbe Umgebung sieht wie der Lauf vor einem Deploy und rote wie grüne
# Ergebnisse vergleichbar bleiben.
#
# Die Jobs `Test-Gate` und `doku` sind die Pflichtprüfungen der Branch Protection auf
# `main` (siehe `docs/ci.md`). Wird einer umbenannt, muss die
# Repository-Einstellung mit umbenannt werden, sonst blockiert eine nie startende
# Prüfung jeden Merge.
name: CI

on:
  pull_request:
    branches: [main]

# Ein überholter PR-Lauf hat keinen Wert: neuer Push, alter Lauf raus. (Im Deploy ist das
# absichtlich andersherum — dort würde ein Abbruch einen halb ausgerollten Stack hinterlassen.)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Fork-Pull-Requests bekommen ohnehin nur ein Lese-Token; hier explizit, damit der Lauf
# keine Schreibrechte anfasst, die er nicht braucht.
permissions:
  contents: read

jobs:
  test:
    name: Test-Gate
    runs-on: ubuntu-latest
    # Die Suite braucht eine erreichbare Postgres: `ElternsprechtagApplicationTests` startet
    # den echten Context und damit die Default-Datasource aus application.properties, und die
    # Service-Tests laufen über `@ServiceTest` (Replace.NONE) gegen dieselbe Datenbank statt
    # gegen eine untergeschobene In-Memory-Instanz. Fehlt dieser Container, ist die Suite rot
    # — sie weicht nicht auf einen Ersatz aus. Lokal bedient die Entwickler-Postgres aus
    # `compose.yaml` denselben Zweck. Werte, Port und Datenbankname stimmen deshalb
    # absichtlich mit `compose.yaml` und mit dem Test-Gate in `deploy-demo.yml` überein.
    services:
      database:
        image: postgres:17
        env:
          POSTGRES_DB: elternsprechtag
          POSTGRES_USER: myuser
          POSTGRES_PASSWORD: mysecret
        ports:
          - 5432:5432
        # Ohne Healthcheck startet Maven, bevor Postgres Verbindungen annimmt.
        options: >-
          --health-cmd "pg_isready -U myuser -d elternsprechtag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Die Testsuite läuft gegen eine eigene Datenbank, nicht gegen die der Anwendung (siehe
      # src/test/resources/application-test.properties). Lokal legt docker/init-test-db.sql sie
      # beim ersten Containerstart an; ein Service-Container kann kein Init-Skript aus dem
      # Repository mounten, weil er vor dem Checkout startet — deshalb hier als eigener Schritt.
      - name: Test-Datenbank anlegen
        run: PGPASSWORD=mysecret psql -h localhost -U myuser -d elternsprechtag -c 'CREATE DATABASE elternsprechtag_test'

      - name: mvn verify
        run: ./mvnw -B verify

  # Baut die Anwender-Doku aus `site/` ohne Deploy — derselbe Ablauf wie in `docs.yml`
  # (`.github/actions/doku-site`): Demo-Instanz starten, Screenshots erzeugen, Site bauen, samt
  # Prüfung auf Vorlage, Alt-Texte und tote interne Links. Mit `src/main/` und `pom.xml` zählt
  # auch eine Änderung an der App oder ihren Abhängigkeiten (etwa ein Vaadin-Upgrade): Greift ein
  # Screenshot-Selektor nicht mehr, wird der PR hier rot und nicht erst `main`. Mit
  # `docs/arc/ABDECKUNG.md` zählt eine neue Einstufung „bewusst nein“: `npm test` verlangt sie auf
  # der Seite *Was die Anwendung kann – und was nicht*. Berührt der PR nichts davon, bleiben die
  # Schritte übersprungen und der Job ist grün. Bewusst ein Filter im Job statt `paths` am
  # Trigger: der gälte für den ganzen Workflow und damit auch für das Test-Gate, und eine
  # Pflichtprüfung, die nie startet, ließe jeden PR ohne passende Änderung ewig warten.
  doku:
    name: doku
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Berührt der PR die Doku oder die App?
        id: doku_betroffen
        run: |
          if git diff --quiet HEAD^1 HEAD -- site/ src/main/ pom.xml docs/arc/ABDECKUNG.md .github/actions/doku-site/; then
            echo "doku=false" >> "$GITHUB_OUTPUT"
          else
            echo "doku=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.doku_betroffen.outputs.doku == 'true'
        uses: ./.github/actions/doku-site
