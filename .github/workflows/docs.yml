# Veröffentlicht die Anwender-Doku aus `site/` auf GitHub Pages (https://docs.openclassware.de).
#
#   Demo-Instanz starten -> Screenshots erzeugen -> Site bauen -> Pages-Artefakt -> Pages deployt
#
# Alles bis zum gebauten `site/dist` steht in `.github/actions/doku-site`; denselben Ablauf ohne
# Deploy fährt der Job `doku` in `ci.yml` auf jedem Pull Request, der `site/` oder `src/main/`
# berührt. Der Build prüft Vorlage, Alt-Texte und tote interne Links und bricht ab, bevor etwas
# veröffentlicht wird. Weil die Screenshots aus der App kommen, läuft er auch bei Änderungen an
# `src/main/` und `pom.xml`.
#
# Was einmalig von Hand eingestellt ist (Pages-Quelle, Custom Domain, DNS), steht in
# `docs/deploy.md` unter „Doku-Site“.
name: Doku-Site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/main/**'
      - 'pom.xml'
      - '.github/actions/doku-site/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Ein laufendes Pages-Deployment wird nicht abgebrochen, der nächste Lauf reiht sich ein.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Site bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/doku-site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    name: Auf Pages veröffentlichen
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
