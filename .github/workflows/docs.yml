# Veröffentlicht die Anwender-Doku aus `site/` als Image `ghcr.io/openclassware/elternsprechtag-docs`
# nach GHCR.
#
#   Demo-Instanz starten -> Screenshots erzeugen -> Site bauen -> Image nach GHCR
#
# Alles bis zum gebauten `site/dist` steht in `.github/actions/doku-site`; denselben Ablauf ohne
# Veröffentlichen fährt der Job `doku` in `ci.yml` auf jedem Pull Request, der `site/` oder
# `src/main/` berührt. Der Build prüft Vorlage, Alt-Texte und tote interne Links und bricht ab,
# bevor etwas veröffentlicht wird.
#
# Das Image trägt wie das App-Image aus `deploy-demo.yml` `latest` und den Commit-SHA. Damit es
# zum App-Image eines Commits auf `main` den passenden Doku-Stand gibt, läuft der Workflow bei
# jedem Push, nicht nur bei Änderungen an `site/` — die Screenshots kommen ohnehin aus der App.
# Wie beim App-Image gilt: Kommen mehrere Pushes während eines Laufs, wartet nur der letzte, die
# dazwischen bekommen keinen eigenen Tag. Unter https://docs.openclassware.de liefert das Hosting
# die Site aus; auf welchem Server das Image läuft, weiß dieses Repo nicht.
#
# Was einmalig von Hand eingestellt ist (Sichtbarkeit des GHCR-Pakets), steht in
# `docs/deploy.md` unter „Doku-Site“.
name: Doku-Site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Ein laufender Lauf wird nicht abgebrochen, der nächste reiht sich ein — so überholt kein
# älterer Stand das `latest` eines neueren.
concurrency:
  group: doku-site
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/openclassware/elternsprechtag-docs

jobs:
  build:
    name: Site bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/doku-site

      - uses: actions/upload-artifact@v7
        with:
          name: doku-site
          path: site/dist
          retention-days: 1

  # Ein eigener Job, damit das Schreibrecht auf GHCR nicht in dem Job liegt, der npm, Maven und
  # die App ausführt. Er nimmt die Site aus dem Artefakt des Jobs `build`.
  image:
    name: Doku-Image bauen & pushen
    needs: build
    # `workflow_dispatch` lässt sich auf jedem Branch starten; `latest` soll trotzdem `main` sein.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Für den Push nach GHCR mit dem automatischen GITHUB_TOKEN.
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: doku-site
          path: site/dist

      - uses: docker/setup-buildx-action@v4

      - name: Bei GHCR anmelden
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Kontext ist das fertige `site/dist`, nicht `site/` — so kommt nur die gebaute Site ins
      # Image, unter `/site`.
      - name: Bauen und pushen
        uses: docker/build-push-action@v7
        with:
          context: site/dist
          file: site/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
