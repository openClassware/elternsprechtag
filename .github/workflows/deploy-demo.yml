# Deploy-Kette für die Demo-Umgebung (https://demo.openclassware.de).
#
#   Test-Gate (mvn verify) -> Image bauen & nach GHCR pushen -> per SSH auf dem VPS ausrollen
#
# Der VPS baut nichts selbst: der teure Vaadin-Production-Build läuft hier auf dem
# Runner, der Server zieht nur das fertige Image. Ein rotes Test-Gate bricht die
# Kette ab, bevor irgendetwas gepusht oder ausgerollt wird.
#
# Dieselbe Kette setzt täglich die Demo zurück (siehe `schedule` unten) — ein zweiter
# Reset-Weg neben dem Deploy würde nur auseinanderlaufen.
name: Deploy Demo

on:
  push:
    branches: [main]
  # Täglicher Demo-Reset um 02:00 UTC: der Deploy-Lauf setzt die Datenbank ohnehin vor
  # jedem Start zurück, also genügt es, ihn zu wiederholen. Ohne ihn sammelt die Demo
  # zwischen zwei Pushes Fremdeingaben an — inklusive echter Namen und Adressen.
  # GitHub schaltet zeitgesteuerte Workflows nach 60 Tagen ohne Repo-Aktivität ab;
  # bleibt die Demo stehen, ist das die erste Stelle zum Nachsehen.
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

# Zwei Deploys gleichzeitig würden sich auf dem Server ins Gehege kommen. Laufende
# Deploys werden bewusst NICHT abgebrochen — ein halb ausgerollter Stack ist schlimmer
# als ein überholter. Die Gruppe hängt an keinem Trigger, deshalb reiht sich auch der
# nächtliche Reset hinter einem laufenden Deploy aus `main` ein, statt ihn zu kreuzen.
concurrency:
  group: deploy-demo
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/openclassware/elternsprechtag
  # Zielverzeichnis des Compose-Stacks auf dem VPS.
  REMOTE_DIR: /opt/elternsprechtag
  # Nicht geheime Stack-Werte. Die Geheimnisse daneben kommen aus GitHub Secrets.
  DEMO_DOMAIN: demo.openclassware.de
  POSTGRES_DB: elternsprechtag
  POSTGRES_USER: elternsprechtag

jobs:
  test:
    name: Test-Gate
    runs-on: ubuntu-latest
    # Die Suite braucht eine erreichbare Postgres: `ElternsprechtagApplicationTests` startet
    # den echten Context und damit die Default-Datasource aus application.properties, und die
    # Service-Tests laufen über `@ServiceTest` (Replace.NONE) gegen dieselbe Datenbank statt
    # gegen eine untergeschobene In-Memory-Instanz. Fehlt dieser Container, ist die Suite rot
    # — sie weicht nicht auf einen Ersatz aus. Lokal bedient die Entwickler-Postgres aus
    # `compose.yaml` denselben Zweck. Werte, Port und Datenbankname stimmen deshalb
    # absichtlich mit `compose.yaml` überein.
    services:
      database:
        image: postgres:17
        env:
          POSTGRES_DB: elternsprechtag
          POSTGRES_USER: myuser
          POSTGRES_PASSWORD: mysecret
        ports:
          - 5432:5432
        # Ohne Healthcheck startet Maven, bevor Postgres Verbindungen annimmt.
        options: >-
          --health-cmd "pg_isready -U myuser -d elternsprechtag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Die Testsuite läuft gegen eine eigene Datenbank, nicht gegen die der Anwendung (siehe
      # src/test/resources/application-test.properties). Lokal legt docker/init-test-db.sql sie
      # beim ersten Containerstart an; ein Service-Container kann kein Init-Skript aus dem
      # Repository mounten, weil er vor dem Checkout startet — deshalb hier als eigener Schritt.
      - name: Test-Datenbank anlegen
        run: PGPASSWORD=mysecret psql -h localhost -U myuser -d elternsprechtag -c 'CREATE DATABASE elternsprechtag_test'

      - name: mvn verify
        run: ./mvnw -B verify

  image:
    name: Image bauen & pushen
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Für den Push nach GHCR mit dem automatischen GITHUB_TOKEN.
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Bei GHCR anmelden
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bauen und pushen
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # `latest` als sprechender Zeiger, der Commit-SHA als unveränderlicher Tag —
          # der Deploy rollt gegen den SHA aus, damit `compose up` den Wechsel sicher
          # bemerkt (bei `latest` bliebe der alte Container ggf. unangetastet).
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Auf VPS ausrollen
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Der Server zieht das Image mit einem kurzlebigen Token dieses Laufs,
      # damit das GHCR-Paket privat bleiben kann.
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: SSH-Zugang einrichten
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: .env erzeugen
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          ORGANIZER_USERNAME: ${{ secrets.ORGANIZER_USERNAME }}
          ORGANIZER_PASSWORD: ${{ secrets.ORGANIZER_PASSWORD }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
        run: |
          # Compose interpoliert `$` in .env-Werten. Die Secrets liegen im Klartext
          # vor (bcrypt-Hashes strotzen vor `$`), also hier verdoppeln.
          escape() { printf '%s' "$1" | sed 's/\$/$$/g'; }
          umask 077
          cat > deploy/.env <<EOF
          APP_IMAGE=${IMAGE}:${GITHUB_SHA}
          DEMO_DOMAIN=${DEMO_DOMAIN}
          ACME_EMAIL=$(escape "$ACME_EMAIL")
          POSTGRES_DB=${POSTGRES_DB}
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=$(escape "$POSTGRES_PASSWORD")
          ORGANIZER_USERNAME=$(escape "$ORGANIZER_USERNAME")
          ORGANIZER_PASSWORD_HASH=$(escape "$ORGANIZER_PASSWORD")
          EOF

      - name: Stack-Dateien übertragen
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" "mkdir -p '$REMOTE_DIR'"
          scp -i ~/.ssh/id_deploy \
            deploy/compose.yaml deploy/Caddyfile deploy/.env \
            "$SSH_USER@$SSH_HOST:$REMOTE_DIR/"
          # scp überträgt keine Rechte: die .env mit DB- und Organizer-Geheimnis
          # landet sonst mit der Standard-umask des Servers (meist weltlesbar).
          ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" "chmod 600 '$REMOTE_DIR/.env'"

      - name: Image ziehen, Datenbank zurücksetzen, Stack neu starten
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Das Token kommt über stdin statt als Argument — Kommandozeilen sind auf
          # dem Zielsystem für jeden Prozess sichtbar.
          printf '%s' "$REGISTRY_TOKEN" | ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          # Der Reset des Schemas ersetzt das frühere `ddl-auto=create-drop` der Demo: Seit
          # Flyway das Schema besitzt, baut die App es beim Start nicht mehr neu auf, sondern
          # migriert eine vorhandene Datenbank weiter. Ohne den Reset überlebten Fremdeingaben
          # jeden Deploy und der nächtliche Lauf verlöre seinen Zweck.
          #
          # `DROP SCHEMA public` statt Volume verwerfen: es trifft genau die Daten dieser
          # Datenbank und lässt Postgres selbst stehen. Danach läuft dieselbe Migrationskette
          # auf eine leere Datenbank, die auch eine Schulinstanz bei der Erstinstallation fährt
          # — der tägliche Beweis, dass die Kette durchläuft.
          #
          # Reihenfolge: App anhalten (sonst schreibt sie während des Drops weiter), Datenbank
          # leeren, dann `up -d`. Der Start ist auch für Läufe ohne neuen Commit nötig — bei
          # unverändertem APP_IMAGE ließe `up -d` den laufenden Container sonst unangetastet.
          # `--wait` wartet den Healthcheck der Datenbank ab; frisch erzeugt nimmt sie sonst
          # noch keine Verbindungen an und der Reset scheiterte am ersten Deploy nach einem
          # Server-Neustart.
          ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" "set -e
            cd '$REMOTE_DIR'
            docker compose pull
            docker compose up -d --wait database
            docker compose stop app
            reset_rc=0
            docker compose exec -T database sh -c \
              'PGPASSWORD=\"\$POSTGRES_PASSWORD\" psql -v ON_ERROR_STOP=1 -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" \
                 -c \"DROP SCHEMA public CASCADE; CREATE SCHEMA public;\"' || reset_rc=\$?
            docker compose up -d
            docker logout ghcr.io
            # Der SHA-Tag je Deploy summiert sich sonst auf der kleinen Platte.
            docker image prune -af --filter 'until=168h'
            # Ein gescheiterter Reset lässt den Lauf rot werden — aber erst hier, nachdem der
            # Stack wieder oben ist. Bräche `set -e` direkt nach dem Fehler ab, bliebe die Demo
            # offline: `restart: always` holt einen ausdrücklich gestoppten Container nicht zurück.
            exit \$reset_rc"
