# Veröffentlicht die Anwendung als Image `ghcr.io/openclassware/elternsprechtag` nach GHCR.
#
#   Test-Gate (mvn verify) -> Image bauen -> nach GHCR pushen (`latest` und Commit-SHA)
#
# Ausgerollt wird hier nichts: Wo das Image läuft, weiß dieses Repo nicht (#232). Der teure
# Vaadin-Production-Build läuft auf dem Runner, ein Betreiber zieht nur das fertige Image. Ein
# rotes Test-Gate bricht ab, bevor irgendetwas gepusht wird.
#
# Das Doku-Image aus `docs.yml` trägt dieselben Tags; so gibt es zu jedem Commit auf `main` App
# und Doku im selben Stand.
name: Image veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

# Ein laufender Lauf wird nicht abgebrochen, der nächste reiht sich ein — so überholt kein
# älterer Stand das `latest` eines neueren.
concurrency:
  group: image
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/openclassware/elternsprechtag

jobs:
  test:
    name: Test-Gate
    runs-on: ubuntu-latest
    # Die Suite braucht eine erreichbare Postgres: `ElternsprechtagApplicationTests` startet
    # den echten Context und damit die Default-Datasource aus application.properties, und die
    # Service-Tests laufen über `@ServiceTest` (Replace.NONE) gegen dieselbe Datenbank statt
    # gegen eine untergeschobene In-Memory-Instanz. Fehlt dieser Container, ist die Suite rot
    # — sie weicht nicht auf einen Ersatz aus. Lokal bedient die Entwickler-Postgres aus
    # `compose.yaml` denselben Zweck. Werte, Port und Datenbankname stimmen deshalb
    # absichtlich mit `compose.yaml` und mit dem Test-Gate in `ci.yml` überein.
    services:
      database:
        image: postgres:17
        env:
          POSTGRES_DB: elternsprechtag
          POSTGRES_USER: myuser
          POSTGRES_PASSWORD: mysecret
        ports:
          - 5432:5432
        # Ohne Healthcheck startet Maven, bevor Postgres Verbindungen annimmt.
        options: >-
          --health-cmd "pg_isready -U myuser -d elternsprechtag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Die Testsuite läuft gegen eine eigene Datenbank, nicht gegen die der Anwendung (siehe
      # src/test/resources/application-test.properties). Lokal legt docker/init-test-db.sql sie
      # beim ersten Containerstart an; ein Service-Container kann kein Init-Skript aus dem
      # Repository mounten, weil er vor dem Checkout startet — deshalb hier als eigener Schritt.
      - name: Test-Datenbank anlegen
        run: PGPASSWORD=mysecret psql -h localhost -U myuser -d elternsprechtag -c 'CREATE DATABASE elternsprechtag_test'

      - name: mvn verify
        run: ./mvnw -B verify

  # Ein eigener Job, damit das Schreibrecht auf GHCR nicht in dem Job liegt, der Maven und die
  # Tests ausführt.
  image:
    name: Image bauen & pushen
    needs: test
    # `workflow_dispatch` lässt sich auf jedem Branch starten; `latest` soll trotzdem `main` sein.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Für den Push nach GHCR mit dem automatischen GITHUB_TOKEN.
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Bei GHCR anmelden
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bauen und pushen
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # `latest` als sprechender Zeiger, der Commit-SHA als unveränderlicher Tag — wer
          # gegen den SHA ausrollt, bemerkt den Wechsel sicher und kann gezielt zurückrollen.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
