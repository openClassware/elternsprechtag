# Profil 'test': aktiv in der gesamten Testsuite (siehe ServiceTest und die @SpringBootTest-Klassen).
#
# Zweck ist genau eine Sache: die Tests auf eine eigene Datenbank zeigen zu lassen. Die
# Service-Tests räumen vor jedem Test alle Tabellen ab (AbstractServiceTest#cleanDb). Ohne diese
# Trennung träfe das die Entwicklungsdatenbank aus compose.yaml — ein `./mvnw verify` würde die
# Daten leeren, mit denen gerade entwickelt wird, und das lautlos auch bei laufender Anwendung.
#
# Diese Datei ERGÄNZT application.properties, sie ersetzt sie nicht: Profil-Dateien werden
# zusätzlich geladen und überschreiben nur die Schlüssel, die sie selbst setzen. Deshalb steht
# hier ausschließlich die URL — Benutzername und Passwort bleiben die aus application.properties.
# (Eine Datei namens `application.properties` unter src/test/resources würde die Haupt-Datei
# dagegen im Classpath verdrängen. Genau deshalb ist es ein Profil.)
#
# Die Datenbank legt docker/init-test-db.sql beim ersten Start des Containers an; im CI legt sie
# ein eigener Workflow-Schritt an.
#
# Der Platzhalter heißt bewusst TEST_DATASOURCE_URL und nicht SPRING_DATASOURCE_URL: Sonst würde
# eine für Demo oder Produktion gesetzte Umgebungsvariable die Testsuite auf die echte Datenbank
# umlenken — und die räumt sie vor jedem Test ab. Der Variablenname darf sich mit dem der
# Anwendung nicht überschneiden.
spring.datasource.url=${TEST_DATASOURCE_URL:jdbc:postgresql://localhost:5432/elternsprechtag_test}
