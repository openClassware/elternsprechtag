# 'demo'-Profil: befüllt die DB mit Stammdaten-Testdaten (data-demo.sql).
# Aktivieren z.B. mit: spring.profiles.active=local,demo

# SQL-Init einschalten (Default 'embedded' würde bei Postgres nichts laden)
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-demo.sql

# Kein `spring.jpa.defer-datasource-initialization` mehr: Das Flag verschob den Seed früher hinter
# Hibernates Schema-Erstellung. Jetzt legt Flyway das Schema an, und zwar bei der Initialisierung
# der Datasource — davor läuft kein Seed, danach schon. Schlimmer: Mit gesetztem Flag hängt die
# EntityManagerFactory nicht mehr an der Datenbank-Initialisierung, Hibernate validierte also
# gegen ein Schema, das Flyway noch gar nicht angelegt hat, und der Start scheiterte.
# Festgehalten in DemoSeedSmokeTest.

# --- Härtung für den öffentlichen, containerisierten Demo-Betrieb (Issue #2) ---

# Die Demo baut ihr Schema NICHT mehr selbst auf (früher: ddl-auto=create-drop), sondern läuft
# durch dieselbe Flyway-Migrationskette wie eine Schulinstanz. Sonst würde die Kette nirgends
# automatisch ausgeführt, bevor eine Schule sie ausführt — die Demo wäre als Probelauf wertlos.
# Wegwerfbar bleibt die Demo trotzdem: Der Deploy setzt die Datenbank vor jedem Start zurück
# (siehe .github/workflows/deploy-demo.yml), danach migriert Flyway auf die leere Datenbank und
# data-demo.sql seedet deterministisch neu. Fremdeingaben verschwinden damit wie bisher
# spätestens mit dem nächtlichen Reset.

# Kein Browser-Autostart im Container.
vaadin.launch-browser=false

# H2-Console in der öffentlich erreichbaren Instanz nicht exponieren (Angriffsfläche minimieren).
spring.h2.console.enabled=false
