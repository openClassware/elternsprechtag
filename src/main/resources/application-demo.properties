# 'demo'-Profil: befüllt die DB mit Stammdaten-Testdaten (data-demo.sql).
# Aktivieren z.B. mit: spring.profiles.active=local,demo

# SQL-Init einschalten (Default 'embedded' würde bei Postgres nichts laden)
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-demo.sql

# Skript erst NACH Hibernates Schema-Erstellung ausführen
spring.jpa.defer-datasource-initialization=true
