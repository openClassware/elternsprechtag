# 'demo'-Profil: befüllt die Datenbank mit Demo-Stammdaten.
# Aktivieren z.B. mit: spring.profiles.active=local,demo

# Der Seed ist eine Flyway-Migration (db/demo/R__demo_stammdaten.sql) und liegt in einem eigenen
# Verzeichnis, das nur dieses Profil in die Suchpfade aufnimmt. `db/migration` muss dabei mit
# aufgezählt werden — die Eigenschaft ersetzt den Standardwert, sie ergänzt ihn nicht; ohne den
# ersten Eintrag stünde die Demo ohne Schema da.
#
# Damit fasst genau ein Mechanismus Schema und Stammdaten an. Vorher tat das zusätzlich Springs
# SQL-Initialisierung (`spring.sql.init.*` mit `data-demo.sql`) — ein zweiter Weg neben Flyway,
# dessen Reihenfolge zum Schemaaufbau eigens eingestellt werden musste und der dabei leicht
# auseinanderlief.
#
# Eine Schulinstanz aktiviert dieses Profil nicht, sieht `db/demo` also gar nicht erst und bekommt
# keine Demo-Daten. Beide Seiten halten DemoSeedMigrationTest
# und SchulinstanzOhneDemoSeedTest fest.
spring.flyway.locations=classpath:db/migration,classpath:db/demo

# --- Härtung für den öffentlichen, containerisierten Demo-Betrieb (Issue #2) ---

# Die Demo baut ihr Schema NICHT mehr selbst auf (früher: ddl-auto=create-drop), sondern läuft
# durch dieselbe Flyway-Migrationskette wie eine Schulinstanz. Sonst würde die Kette nirgends
# automatisch ausgeführt, bevor eine Schule sie ausführt — die Demo wäre als Probelauf wertlos.
# Wegwerfbar bleibt die Demo trotzdem: Der Deploy setzt die Datenbank vor jedem Start zurück
# (siehe .github/workflows/deploy-demo.yml), danach migriert Flyway auf die leere Datenbank und
# seedet dabei deterministisch neu. Fremdeingaben verschwinden damit wie bisher spätestens mit
# dem nächtlichen Reset.

# Kein Browser-Autostart im Container.
vaadin.launch-browser=false
