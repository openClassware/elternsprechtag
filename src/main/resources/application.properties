spring.application.name=elternsprechtag
vaadin.launch-browser=true

# Database Connection
# Umgebungsvariablen mit lokalen Defaults: ohne gesetzte Variablen startet die App unverändert.
# Die Defaults sind reine Local-Dev-Werte; produktive/Demo-Zugangsdaten kommen aus der Umgebung.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/elternsprechtag}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:myuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mysecret}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Organizer Login Credentials
# Der Algorithmus-Präfix {bcrypt} steht bewusst VOR dem Platzhalter: der Default-Wert eines
# ${VAR:default} darf kein '}' enthalten, sonst schlösse Springs Placeholder-Parser am '}' von
# {bcrypt} zu früh. Die Umgebungsvariable liefert daher nur den nackten bcrypt-Hash (ohne Präfix).
#
# Die Variablen heißen bewusst NICHT ELTERNSPRECHTAG_SECURITY_ORGANIZER_*: Springs Relaxed
# Binding übersetzt so benannte Umgebungsvariablen direkt in diese Properties und verdrängt
# die Zeile hier samt {bcrypt}-Präfix — der Login scheiterte dann an "no default password
# encoder configured". Ein eigener Variablenname lässt den Platzhalter unten greifen.
elternsprechtag.security.organizer.username=${ORGANIZER_USERNAME:user}
elternsprechtag.security.organizer.password={bcrypt}${ORGANIZER_PASSWORD_HASH:$2a$10$dXJ3SW6G7P50lGmMkkmwe.20cQQubK3.HZWzG3YB1tlRy.fqvM/BG}

# School Configuration
elternsprechtag.schoolname=Gesamtschule Lindenhof

# Mail / SMTP für Absage-Benachrichtigungen.
# Erst mit gesetztem spring.mail.host wird der echte JavaMail-Versand aktiv; ohne greift die
# Log-Attrappe. Absenderadresse und SMTP-Zugang gehören in die Umgebung, nicht ins Repository.
# Umlaute/ß im Mailtext verlangen UTF-8 unabhängig vom Plattform-Charset:
spring.mail.default-encoding=UTF-8
# spring.mail.host bleibt bewusst OHNE Default: Ist die Umgebungsvariable SPRING_MAIL_HOST gesetzt,
# aktiviert Spring per Relaxed Binding den echten JavaMail-Versand; sonst greift die Log-Attrappe
# (BenachrichtigungConfig via @ConditionalOnProperty). Ein leerer Default "${SPRING_MAIL_HOST:}"
# würde den Host als gesetzt gelten lassen und den echten Sender fälschlich aktivieren.
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS_ENABLE:true}
elternsprechtag.mail.absender=${ELTERNSPRECHTAG_MAIL_ABSENDER:elternsprechtag@example.com}