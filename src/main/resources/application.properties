spring.application.name=elternsprechtag
vaadin.launch-browser=true

# Database Connection
# Umgebungsvariablen mit lokalen Defaults: ohne gesetzte Variablen startet die App unverändert.
# Die Defaults sind reine Local-Dev-Werte; produktive/Demo-Zugangsdaten kommen aus der Umgebung.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/elternsprechtag}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:myuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mysecret}

# Schema
# Das Schema gehört Flyway (src/main/resources/db/migration) — seit dem Wegfall von JPA allein.
# Spring Data JDBC bringt weder Schema-Generierung noch eine Validierung beim Start mit; es gibt
# also keine zweite Stelle mehr, die das Schema beschreiben und von der Migration abweichen könnte.
# Was früher Hibernates `validate` beim Kontextstart abfing, prüfen jetzt die Persistenz-Tests
# (@DataJdbcTest gegen dieselbe migrierte Postgres).

# Organizer Login Credentials
# Der Algorithmus-Präfix {bcrypt} steht bewusst VOR dem Platzhalter: der Default-Wert eines
# ${VAR:default} darf kein '}' enthalten, sonst schlösse Springs Placeholder-Parser am '}' von
# {bcrypt} zu früh. Die Umgebungsvariable liefert daher nur den nackten bcrypt-Hash (ohne Präfix).
#
# Die Variablen heißen bewusst NICHT ELTERNSPRECHTAG_SECURITY_ORGANIZER_*: Springs Relaxed
# Binding übersetzt so benannte Umgebungsvariablen direkt in diese Properties und verdrängt
# die Zeile hier samt {bcrypt}-Präfix — der Login scheiterte dann an "no default password
# encoder configured". Ein eigener Variablenname lässt den Platzhalter unten greifen.
elternsprechtag.security.organizer.username=${ORGANIZER_USERNAME:user}
elternsprechtag.security.organizer.password={bcrypt}${ORGANIZER_PASSWORD_HASH:$2a$10$dXJ3SW6G7P50lGmMkkmwe.20cQQubK3.HZWzG3YB1tlRy.fqvM/BG}

# School Configuration
elternsprechtag.schoolname=Gesamtschule Lindenhof

# Mail / SMTP für Absage-Benachrichtigungen.
# Erst mit gesetztem spring.mail.host wird der echte JavaMail-Versand aktiv; ohne greift die
# Log-Attrappe. Absenderadresse und SMTP-Zugang gehören in die Umgebung, nicht ins Repository.
# Umlaute/ß im Mailtext verlangen UTF-8 unabhängig vom Plattform-Charset:
spring.mail.default-encoding=UTF-8
# spring.mail.host bleibt bewusst OHNE Default: Ist die Umgebungsvariable SPRING_MAIL_HOST gesetzt,
# aktiviert Spring per Relaxed Binding den echten JavaMail-Versand; sonst greift die Log-Attrappe
# (BenachrichtigungConfig via @ConditionalOnProperty). Ein leerer Default "${SPRING_MAIL_HOST:}"
# würde den Host als gesetzt gelten lassen und den echten Sender fälschlich aktivieren.
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS_ENABLE:true}
elternsprechtag.mail.absender=${ELTERNSPRECHTAG_MAIL_ABSENDER:elternsprechtag@example.com}
# Flyway-Validierung: Eine wiederholbare Migration, die in dieser Instanz nicht (mehr) auffindbar
# ist, blockiert den Start nicht. Betroffen ist genau ein Skript: der Demo-Seed
# (db/demo/R__demo_stammdaten.sql), den nur das 'demo'-Profil in seinen Suchpfaden hat. Ohne diese
# Zeile käme jede Datenbank, die einmal als Demo lief, ohne das Profil nicht mehr hoch — Flyway
# fände einen angewandten Eintrag ohne zugehöriges Skript. Das trifft in erster Linie die lokale
# Entwicklung, wo dieselbe Datenbank mal mit und mal ohne 'demo' startet.
#
# Die Zeile steht deshalb hier und nicht in application-demo.properties: Sie muss genau dann
# greifen, wenn das Demo-Profil NICHT aktiv ist. Enger als 'repeatable' lässt sie sich nicht
# fassen — Flyways Muster kennen nur Migrationstyp und -zustand, keine Skriptnamen. Betroffen ist
# davon aber ohnehin nur der Demo-Seed: Er ist die einzige wiederholbare Migration im Projekt.
#
# Versionierte Migrationen bleiben streng geprüft: Verschwindet ein ausgeliefertes V-Skript oder
# ändert sich seine Prüfsumme, scheitert der Start weiterhin.
#
# `*:future` steht mit dabei, weil die Eigenschaft Flyways Standardwert ERSETZT statt ihn zu
# ergänzen — und dieser Standardwert genau `*:future` ist. Ohne den Eintrag käme eine Instanz nach
# einem Rollback nicht mehr hoch: In der Historientabelle stünde dann eine Migration, die neuer ist
# als alles, was das zurückgerollte Image mitbringt. Dasselbe trifft die lokale Entwicklung beim
# Wechsel zurück von einem Branch, der eine Migration hinzugefügt hat.
spring.flyway.ignore-migration-patterns=*:future,repeatable:missing

# Erinnerungs-Scheduler (Issue #107) — der erste zeitgesteuerte Vorgang im Produkt.
# Läuft täglich um 07:00 Uhr; verstellbar, falls sich das mit dem SMTP-Fenster oder anderen
# Läufen beißt. Cron-Syntax von Spring (Sekunde Minute Stunde Tag Monat Wochentag).
elternsprechtag.scheduler.erinnerung-cron=${ELTERNSPRECHTAG_ERINNERUNG_CRON:0 0 7 * * *}
